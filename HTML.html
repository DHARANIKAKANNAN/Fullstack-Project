<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Local Community Event Portal</title>

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
font-family:Arial;
margin:0;
background:#f5f5f5;
}

nav{
background:#1f4ea8;
padding:15px;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
}

#welcomeBanner{
background:blue;
color:white;
padding:20px;
text-align:center;
}

.highlight{
background:yellow;
padding:4px;
}

table{
margin:auto;
}

.event-img{
width:180px;
height:120px;
border:4px solid black;
border-radius:10px;
}

form{
background:white;
width:60%;
margin:auto;
padding:20px;
border-radius:10px;
}

input,select,textarea{
width:100%;
padding:10px;
margin:8px;
}

button{
padding:10px;
background:green;
color:white;
border:none;
cursor:pointer;
}

.icon{
font-size:22px;
margin-right:8px;
}

</style>

<script>

function validatePhone(){

let phone=document.getElementById("phone").value;

if(phone.length!=10)
alert("Enter valid phone number");

}

function showFee(){

let value=document.getElementById("eventType").value;

let fee="";

if(value=="Music")
fee="₹500";

else if(value=="Sports")
fee="₹300";

else
fee="₹200";

document.getElementById("fee").innerHTML=
"Event Fee : "+fee;

localStorage.setItem("savedEvent",value);

}

function submitForm(){

document.getElementById("confirm")
.value="Registration Successful";

}

function enlarge(img){

img.style.width="350px";

}

function countChar(){

let txt=
document.getElementById("feedback").value;

document.getElementById("count")
.innerHTML=
"Characters : "+txt.length;

}

function loadPreference(){

let saved=
localStorage.getItem("savedEvent");

if(saved)
document.getElementById("eventType")
.value=saved;

}

function clearData(){

localStorage.clear();

sessionStorage.clear();

alert("Preferences Cleared");

}

function findLocation(){

let options={
enableHighAccuracy:true,
timeout:5000
};

navigator.geolocation.getCurrentPosition(

function(pos){

document.getElementById("location")
.innerHTML=

"Latitude : "
+pos.coords.latitude+

"<br>Longitude : "
+pos.coords.longitude;

},

function(){

alert("Location Error");

},

options

);

}

window.onbeforeunload=function(){

return "Form not completed";

};

function videoReady(){

document.getElementById("videoMsg")
.innerHTML=
"Video ready to play";

}

window.onload=loadPreference;

</script>

</head>

<body>

<!-- Navigation -->

<nav>

<a href="#home">Home</a>

<a href="#events">Events</a>

<a href="#contact">Contact</a>

<a href="help.html" target="_blank">
Help
</a>

</nav>


<div id="welcomeBanner">

<h1>

Welcome Resident

</h1>

<p>

Enjoy

<span style=
"color:red;font-weight:bold">

50% Special Offer

</span>

</p>

</div>


<!-- Main -->

<section id="home">

<h2 class="highlight">

Community Portal

</h2>

</section>


<section id="events">

<h2>Past Event Gallery</h2>

<table>

<tr>

<td>

<img
src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a"
class="event-img"
alt="Music Event"
title="Music Event"
ondblclick="enlarge(this)">

<br><br>

<i class="fa-solid fa-music icon"></i>

Music Show

</td>

<td>

<img
src="https://images.unsplash.com/photo-1517649763962-0c623066013b"
class="event-img"
alt="Sports Event"
title="Sports Event">

<br><br>

<i class="fa-solid fa-football icon"></i>

Sports

</td>

<td>

<img
src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1"
class="event-img"
alt="Food Festival"
title="Food Festival">

<br><br>

<i class="fa-solid fa-utensils icon"></i>

Food Fest

</td>

</tr>


<tr>

<td>

<img
src="https://images.unsplash.com/photo-1508804185872-d7badad00f7d"
class="event-img">

<br><br>

<i class="fa-solid fa-masks-theater icon"></i>

Dance

</td>

<td>

<img
src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da"
class="event-img">

<br><br>

<i class="fa-solid fa-book icon"></i>

Book Fair

</td>

<td>

<img
src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac"
class="event-img">

<br><br>

<i class="fa-solid fa-users icon"></i>

Community Meet

</td>

</tr>

</table>

</section>


<section>

<h2>Register Event</h2>

<form>

<input
type="text"
placeholder="Name"
required
autofocus>

<input
type="email"
placeholder="Email"
required>

<input
type="date"
required>

<input
id="phone"
type="text"
placeholder="Phone"

onblur="validatePhone()">

<select
id="eventType"

onchange="showFee()">

<option>Music</option>

<option>Sports</option>

<option>Food</option>

</select>

<div id="fee"></div>

<textarea
id="feedback"

placeholder="Feedback"

onkeyup="countChar()">

</textarea>

<p id="count"></p>

<button
type="button"

onclick="submitForm()">

Submit

</button>

<output id="confirm"></output>

</form>

</section>


<section>

<h2>Community Events Promo Video</h2>

<video
width="650"
controls
autoplay
muted
oncanplay="videoReady()">

<source
src="https://www.w3schools.com/html/mov_bbb.mp4"
type="video/mp4">

Your browser does not support video.

</video>

<p id="videoMsg"></p>

</section>


<section>

<h2>Nearby Events</h2>

<button onclick="findLocation()">

Find Nearby Events

</button>

<p id="location"></p>

</section>


<section id="contact">

<button onclick="clearData()">

Clear Preferences

</button>

</section>


<!-- Footer -->

<footer>

<p>

© 2026 Local Community Event Portal

</p>

</footer>

</body>

</html>
